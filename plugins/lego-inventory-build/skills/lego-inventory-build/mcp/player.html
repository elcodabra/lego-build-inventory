<!doctype html>
<!-- LEGO build card: shown inline in the chat (MCP Apps / ChatGPT) by the show_build tool.
     Modes: picture (finished model + parts), steps (step-by-step pictures), video.
     Plain JS, no external scripts; talks to the host over the MCP Apps postMessage bridge. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --ink: #1f2328; --muted: #6b7280; --line: #e5e7eb; --chip: #f3f4f6; --accent: #FFD21A; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f3f4f6; --muted: #9ca3af; --line: #3a3a3a; --chip: #2a2a2a; } }
  html, body { margin: 0; background: transparent; font: 14px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  .card { display: flex; gap: 14px; padding: 10px; align-items: stretch; flex-wrap: wrap; }
  .stage { position: relative; flex: 1 1 260px; max-width: 360px; border-radius: 14px; overflow: hidden; background: #fff; border: 1px solid var(--line); }
  .stage.h { max-width: 560px; }
  .sq { width: 100%; aspect-ratio: 1 / 1; display: block; background: #fff; }
  .full > img, .full > video { width: 100%; display: block; }
  /* the film is drawn on a light page colour (d.bg, set inline): keep the bars around it that
     colour too (fullscreen letterboxes a vertical film with black by default) */
  .full > video { background: #fff; object-fit: contain; }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-top: 1px solid var(--line); background: #fff; color: #1f2328; }
  .nav button { border: 0; background: var(--chip); color: #1f2328; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .nav button[disabled] { opacity: .35; cursor: default; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #d1d5db; display: block; }
  .dots i.on { background: #1f2328; }
  .side { flex: 1 1 200px; min-width: 190px; display: flex; flex-direction: column; }
  h2 { margin: 2px 0 0; font-size: 19px; }
  .sub { color: var(--muted); margin: 2px 0 10px; }
  .bom { display: grid; grid-template-columns: 14px 1fr auto; gap: 5px 9px; align-items: center; max-height: 260px; overflow: auto; }
  .sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(0,0,0,.18); }
  .q { color: var(--muted); font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; flex-wrap: wrap; }
  button.act, a.act { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 7px 13px; font: inherit; cursor: pointer; text-decoration: none; }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: #1f2328; font-weight: 600; }
  button.act[disabled] { opacity: .55; cursor: default; }
  .busy { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,255,255,.8); color: #111; font-weight: 600; }
  .empty { padding: 16px; color: var(--muted); }
  .ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 10px; }
  .ideas h2 { grid-column: 1 / -1; }
  .ideas .sub { grid-column: 1 / -1; margin: 0; }
  .idea { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .idea img { width: 100%; aspect-ratio: 1 / 1; display: block; background: #fff; }
  .idea .tx { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .idea b { font-size: 15px; }
  .idea .q { font-size: 13px; }
  .idea.top { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .idea button { margin-top: auto; }
  .almost { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
  .seg { align-self: flex-start; display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin: 0 0 8px; }
  .seg button { border: 0; background: transparent; color: var(--ink); padding: 6px 12px; font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #1f2328; font-weight: 600; }
  .tag { display: inline-block; font-size: 12px; border-radius: 6px; padding: 2px 7px; margin: 0 4px 4px 0; background: #e7f6ec; color: #14532d; }
  .tag.warn { background: #fff4d6; color: #713f12; }
  button:focus-visible, a.act:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
</style>
</head>
<body>
<div id="app" class="empty">Рисую…</div>
<script>
(() => {
  const app = document.getElementById('app');
  const pending = new Map();
  let nextId = 1;
  let data = null;
  let step = 0;
  let exploded = false;

  const post = (msg) => window.parent.postMessage({ jsonrpc: '2.0', ...msg }, '*');
  const request = (method, params) => {
    const id = nextId++;
    post({ id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  };
  const notify = (method, params) => post({ method, params });
  const callTool = (name, args) => (window.openai && window.openai.callTool
    ? window.openai.callTool(name, args)
    : request('tools/call', { name, arguments: args }));

  window.addEventListener('message', (e) => {
    if (e.source !== window.parent) return;
    const m = e.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.id !== undefined && pending.has(m.id)) {
      const p = pending.get(m.id); pending.delete(m.id);
      m.error ? p.reject(m.error) : p.resolve(m.result);
      return;
    }
    if (m.method === 'ui/notifications/tool-result') show(m.params && m.params.structuredContent);
  }, { passive: true });
  window.addEventListener('openai:set_globals', () => { if (window.openai && window.openai.toolOutput) show(window.openai.toolOutput); });

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const url = (u) => (typeof u === 'string' && /^https:\/\//i.test(u) ? esc(u) : '');
  const num = (n) => (Number.isFinite(Number(n)) ? Number(n) : 0);
  const hex = (h) => (/^#[0-9a-f]{3,8}$/i.test(h || '') ? h : '#999');
  const sizeChanged = () => notify('ui/notifications/size-changed', { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
  new ResizeObserver(sizeChanged).observe(document.body);

  function stage(d) {
    const h = d.format === 'horizontal';
    if (d.mode === 'video' && d.videoUrl) {
      const bg = /^#[0-9a-f]{6}$/i.test(String(d.bg || '')) ? d.bg : '#ffffff';
      return `<div class="stage full ${h ? 'h' : ''}" style="background:${bg}"><video style="background:${bg}" src="${url(d.videoUrl)}" poster="${url(d.posterUrl)}" controls autoplay muted loop playsinline></video></div>`;
    }
    if (d.mode === 'steps' && d.stepUrls && d.stepUrls.length) {
      const n = d.stepUrls.length;
      return `<div class="stage full">
        <img class="sq" id="stepimg" src="${url(d.stepUrls[step])}" alt="Шаг ${step + 1}">
        <div class="nav">
          <button id="prev" ${step === 0 ? 'disabled' : ''} aria-label="Назад">‹</button>
          <span><b>${d.disassembly ? 'Разборка' : 'Шаг'} ${step + 1}</b> из ${n}</span>
          <button id="next" ${step === n - 1 ? 'disabled' : ''} aria-label="Дальше">›</button>
        </div></div>`;
    }
    if (d.disassembly && exploded && url(d.disassembly.explodedUrl)) {
      return `<div class="stage"><img class="sq" src="${url(d.disassembly.explodedUrl)}" alt="Exploded view: ${esc(d.title)}"></div>`;
    }
    return `<div class="stage"><img class="sq" src="${url(d.posterUrl)}" alt="${esc(d.title)}"></div>`;
  }

  function showIdeas(d) {
    data = d;
    app.className = 'ideas';
    const items = d.ideas || [];
    app.innerHTML = `
      <h2>${esc(d.title)}</h2>
      <div class="sub">Картинки собраны из твоих ${num(d.drawableParts)} деталей. Первая идея берёт больше всего деталей.</div>
      ${items.map((it, i) => `
        <div class="idea ${i === 0 ? 'top' : ''}">
          ${url(it.thumbUrl) ? `<img src="${url(it.thumbUrl)}" alt="${esc(it.title)}">` : ''}
          <div class="tx">
            <b>${esc(it.title)}</b>
            <span class="q">${num(it.parts)} деталей · ${num(it.usesPercent)}% кучи</span>
            <button class="act ${i === 0 ? 'primary' : ''}" data-idea="${esc(it.idea)}">Собрать</button>
          </div>
        </div>`).join('')}
      ${(d.almost || []).map((a) => `<div class="almost">Почти: <b>${esc(a.title)}</b>, не хватает ${(a.missing || []).map((m) => `${esc(m.name)} ${esc(String(m.color || '').toLowerCase())} ×${num(m.qty)}`).join(', ')}</div>`).join('')}`;
    app.querySelectorAll('button[data-idea]').forEach((b) => { b.onclick = () => buildIdea(b.dataset.idea, b); });
    sizeChanged();
  }

  async function buildIdea(idea, btn) {
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = 'Собираю…';
    try {
      await callTool('idea_build', { idea });
      const r = await callTool('show_build', { name: idea, mode: 'picture' });
      const sc = r && (r.structuredContent || (r.result && r.result.structuredContent));
      if (sc) show(sc); else throw new Error('no result');
    } catch (e) {
      btn.disabled = false; btn.textContent = old + ' (ошибка, ещё раз)';
    }
  }

  function showAnalysis(d) {
    data = d;
    app.className = 'card';
    const a = d.analysis || {};
    const cands = d.candidates || [];
    const known = d.known || [];
    app.innerHTML = `
      <div class="side" style="flex:1 1 100%">
        <h2>${d.status === 'ok' ? 'Что на фото' : 'AI-анализ недоступен'}</h2>
        ${d.status === 'ok' ? `
          <div><span class="tag warn">AI estimate</span><span class="q">${esc(d.provider && d.provider.model)}</span></div>
          <p>${esc(a.object_summary)}</p>
          <div class="sub">Видны цвета: ${(a.visible_colours || []).map(esc).join(', ')}</div>
          <div class="sub">Примерно: ${(a.visible_parts || []).map((p) => `${esc(p.category)} ~${num(p.count_estimate)}`).join(', ')}</div>
          ${(a.uncertainties || []).length ? `<div class="sub">Не видно: ${(a.uncertainties || []).map(esc).join('; ')}</div>` : ''}
          <h3 style="margin:10px 0 4px;font-size:15px">${cands.length ? 'Возможное совпадение: подтверди' : 'Совпадений среди известных моделей нет'}</h3>
          ${cands.length ? '' : `<div class="sub">Попробуй другой ракурс: ${(a.suggested_views || []).map(esc).join(', ')}</div>`}` : `
          <div class="sub">Фото не анализировалось (${esc(d.error)}). Выбери модель сам: точная разборка работает без AI.</div>`}
        <div class="row" style="margin-top:6px">
          ${(cands.length ? cands : known).map((c, i) => `<button class="act ${cands.length && i === 0 ? 'primary' : ''}" data-confirm="${esc(c.name)}">${cands.length ? 'Это ' : ''}${esc(c.title)} · ${num(c.parts)} дет.</button>`).join('')}
        </div>
      </div>`;
    app.querySelectorAll('button[data-confirm]').forEach((b) => { b.onclick = () => run('model_disassemble', { name: b.dataset.confirm, confirmed: true }, b); });
    sizeChanged();
  }

  function show(d) {
    if (d && d.kind === 'ideas') return showIdeas(d);
    if (d && d.kind === 'analysis') return showAnalysis(d);
    if (!d || !d.name) return;
    if (!data || data.name !== d.name || data.mode !== d.mode || !!data.disassembly !== !!d.disassembly) { step = 0; exploded = false; }
    data = d;
    app.className = 'card';
    const dis = d.disassembly;
    app.innerHTML = `
      ${stage(d)}
      <div class="side">
        <div class="seg" role="group" aria-label="Режим">
          <button data-dir="build" aria-pressed="${dis ? 'false' : 'true'}">Build</button>
          <button data-dir="disassemble" aria-pressed="${dis ? 'true' : 'false'}">Disassemble</button>
        </div>
        <h2>${esc(d.title)}</h2>
        ${dis ? '<div><span class="tag">Based on exact model JSON</span><span class="tag warn">Физическая извлекаемость деталей не проверена</span></div>' : ''}
        <div class="sub">${num(d.parts)} деталей · ${num(d.steps)} шагов</div>
        <div class="bom">${(d.bom || []).map((b) => `
          <span class="sw" style="background:${hex(b.hex)}"></span>
          <span>${esc(b.name)} <span class="q">· ${esc(String(b.colorName || b.color || '').toLowerCase())}</span></span>
          <span class="q">×${num(b.qty)}</span>`).join('')}</div>
        <div class="row">${dis ? `
          ${d.mode !== 'steps' ? '<button class="act primary" data-dmode="steps">Шаги разборки</button>' : '<button class="act" data-dmode="picture">Готовая модель</button>'}
          ${d.mode !== 'steps' && url(dis.explodedUrl) ? `<button class="act" id="explode" aria-pressed="${exploded}">${exploded ? 'Собранная' : 'Exploded'}</button>` : ''}` : `
          ${d.mode !== 'steps' ? '<button class="act primary" data-mode="steps">Шаги картинками</button>' : ''}
          ${d.mode !== 'video' ? '<button class="act" data-mode="video">▶ Видео сборки</button>' : `<a class="act" href="${url(d.videoUrl)}" target="_blank" rel="noopener">Скачать mp4</a>`}
          ${d.mode === 'video' && /^https:\/\/(youtu\.be|www\.youtube\.com)\//.test(String(d.youtubeUrl || '')) ? `<a class="act" href="${url(d.youtubeUrl)}" target="_blank" rel="noopener">На YouTube</a>` : ''}
          ${d.mode !== 'picture' ? '<button class="act" data-mode="picture">Готовая модель</button>' : ''}`}
        </div>
      </div>`;
    app.querySelectorAll('button[data-mode]').forEach((b) => { b.onclick = () => switchMode(b.dataset.mode, b); });
    app.querySelectorAll('button[data-dmode]').forEach((b) => { b.onclick = () => run('model_disassemble', { name: data.name, mode: b.dataset.dmode }, b); });
    app.querySelectorAll('button[data-dir]').forEach((b) => {
      b.onclick = () => {
        const toDis = b.dataset.dir === 'disassemble';
        if (toDis === !!data.disassembly) return;
        const mode = data.mode === 'steps' ? 'steps' : 'picture';
        run(toDis ? 'model_disassemble' : 'show_build', toDis ? { name: data.name, mode } : { name: data.name, mode }, b);
      };
    });
    const ex = document.getElementById('explode');
    if (ex) ex.onclick = () => { exploded = !exploded; show(data); };
    if (dis && url(dis.explodedUrl)) { const i = new Image(); i.src = dis.explodedUrl; }
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    app.onkeydown = (e) => { if (e.key === 'ArrowLeft' && prev && !prev.disabled) prev.click(); if (e.key === 'ArrowRight' && next && !next.disabled) next.click(); };
    if (prev) prev.onclick = () => { step = Math.max(0, step - 1); show(data); };
    if (next) next.onclick = () => { step = Math.min(data.stepUrls.length - 1, step + 1); show(data); };
    // preload the other step pictures so paging is instant
    (d.stepUrls || []).forEach((u) => { const i = new Image(); i.src = u; });
    sizeChanged();
  }

  async function run(tool, args, btn) {
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = 'Рисую…';
    try {
      const r = await callTool(tool, args);
      const sc = r && (r.structuredContent || (r.result && r.result.structuredContent));
      if (sc) show(sc); else throw new Error('no result');
    } catch (e) {
      btn.disabled = false; btn.textContent = old + ' (ошибка, ещё раз)';
    }
  }

  async function switchMode(mode, btn) {
    const labels = { steps: 'Рисую шаги…', video: 'Рендерю видео… ~25 с', picture: 'Рисую…' };
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = labels[mode];
    try {
      const r = await callTool('show_build', { name: data.name, mode, format: data.format });
      const sc = r && (r.structuredContent || (r.result && r.result.structuredContent));
      if (sc) show(sc); else throw new Error('no result');
    } catch (e) {
      btn.disabled = false; btn.textContent = old + ' (ошибка, ещё раз)';
    }
  }

  request('ui/initialize', {
    protocolVersion: '2026-01-26',
    appInfo: { name: 'lego-build-card', version: '2.0.0' },
    appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
  }).then(() => {
    notify('ui/notifications/initialized', {});
    if (window.openai && window.openai.toolOutput) show(window.openai.toolOutput);
  }).catch(() => {});
  setTimeout(() => { if (!data && window.openai && window.openai.toolOutput) show(window.openai.toolOutput); }, 800);
})();
</script>
</body>
</html>
